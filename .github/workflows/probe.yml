name: 예약 지연 탐침

# 이 워크플로는 아무 일도 하지 않는다. 시각만 찍는다.
#
# 왜 있나. 뉴스 수집이 예약 시각보다 2~5시간 늦게 시작한다. 원인이 두 가지로
# 갈린다 — 깃허브가 예약 이벤트를 늦게 쏘는 것인지, 러너가 없어 기다리는
# 것인지. 둘을 가리려면 같은 시각에 예약으로 한 번, 수동 실행으로 한 번
# 돌려서 시작 시각을 비교하면 된다.
#
# 뉴스 파이프라인(daily.yml)으로 이 실험을 하면 회차가 두 배가 되고 Groq
# 한도를 태운다. 그래서 별도 파일로 둔다. 한 회 실행이 5초 남짓이고 공개
# 저장소라 사용 시간도 무료다.
#
# 수동 실행 쪽은 바깥 스케줄러가 같은 시각에 보낸다.
#
# 결론이 나면 이 파일을 지운다.

on:
  schedule:
    - cron: "55 6,14,22 * * *"   # daily.yml 과 같은 시각 (KST 15:55/23:55/07:55)
  workflow_dispatch:

jobs:
  # 작업 id 는 영문·숫자·_- 만 된다. 한글을 쓰면 워크플로 파일 자체가
  # 해석되지 않아 실행이 startup_failure 로 죽는다 (2026-09-16 실측).
  probe:
    name: 시각 기록
    runs-on: ubuntu-latest
    steps:
      - name: 시작 시각
        run: |
          echo "이벤트: ${{ github.event_name }}"
          echo "시작(UTC): $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
