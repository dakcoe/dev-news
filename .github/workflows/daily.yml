name: 매일 뉴스 수집

on:
  schedule:
    # KST 00:00 / 08:00 / 16:00 (UTC 15:00 / 23:00 / 07:00)
    - cron: "0 7,15,23 * * *"
  workflow_dispatch:        # 액션 탭에서 수동 실행 가능

permissions:
  contents: write

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # pull --rebase가 공통 조상을 찾을 수 있게 전체 이력

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 · 요약 · 페이지 생성
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # candidates의 GitHub API 한도 확보 (SPEC 1.4)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python build.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data       # index.html · seen.json · articles.json(누적)
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # Re-run(옛 스냅샷 체크아웃)이나 동시 push로 원격이 앞서 있어도 실패하지 않게
            # rebase로 흡수한다. 충돌 시 -X theirs = 방금 생성한 데이터·페이지를 남긴다.
            git pull --rebase -X theirs origin main
            git push origin main
          fi
