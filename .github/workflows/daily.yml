name: 매일 뉴스 수집

on:
  # 예약(cron)을 쓰지 않는다. 깃허브 예약 실행이 2~5시간 늦게 시작했다.
  # 실측 60회 기준 슬롯별 중앙값이 KST 16:00 회차 301분, 00:00 회차 194분,
  # 08:00 회차 110분이다.
  #
  # 러너가 부족해서가 아니다. 2026-09-07 15:00 UTC 예약 회차가 18:59 에
  # 시작하는 동안, 같은 파일의 수동 실행 네 건(15:28·16:34·16:53·17:02)이
  # 전부 0초에 시작했다. 늦게 줄 선 쪽이 먼저 나갔으니 같은 줄이 아니다.
  #
  # 그래서 바깥 스케줄러의 launchd 가 KST 15:55 / 23:55 / 07:55 에 수동 실행을
  # 보낸다 — 실측 2초 안에 시작한다. 수집·요약·커밋은 그대로 여기서 돈다.
  #   보내는 쪽: scripts/daily_trigger.sh
  #   등록:      ~/Library/LaunchAgents/net.dev-news.daily.plist
  #
  # 회차는 여전히 하루 3회다. 바깥 스케줄러가 꺼져 있거나 인터넷이 끊기면 그 회차는
  # 빠진다 — 로그 ~/Library/Logs/dev-news-trigger.log 로 확인한다.
  workflow_dispatch:        # 액션 탭에서 수동 실행 가능

permissions:
  contents: write
  issues: write      # 실패·열화 알림을 이슈로 남긴다 (add-failure-alert)

concurrency:
  group: daily-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # pull --rebase가 공통 조상을 찾을 수 있게 전체 이력

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 수집 · 요약 · 페이지 생성
        id: build
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}   # candidates의 GitHub API 한도 확보 (SPEC 1.4)
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python build.py

      - name: 변경분 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs data       # index.html · seen.json · articles.json(누적)
          if git diff --staged --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "뉴스 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"

            # 원격이 앞서 있을 수 있다 — 옛 SHA에서 Re-run했거나 회차가 겹쳤을 때다.
            # 그대로 rebase하면 -X theirs가 "방금 만든 파일이 이긴다"로 작동해
            # 그 사이 쌓인 기사와 seen 기록이 조용히 사라진다. 게시 건수는 정상이라
            # 열화 알림도 안 뛴다.
            #
            # seen 기록과 기사 아카이브는 더하기만 하는 자료다. 이기고 지는 게 아니라
            # 합집합이 맞다. 커밋 뒤 원격 것을 합쳐 우리 쪽을 상위집합으로 만들고
            # 다시 커밋한다. 그러면 rebase에서 우리가 이겨도 잃는 게 없다.
            git fetch origin main
            if ! git merge-base --is-ancestor origin/main HEAD; then
              echo "원격이 앞서 있다 — 데이터를 합친다"
              python scripts/merge_remote_data.py origin/main
              git add -A docs data
              git diff --staged --quiet || git commit -m "원격 회차 데이터 병합"
            fi

            git pull --rebase -X theirs origin main
            git push origin main
          fi

      # exit 1로 죽은 경우, 그리고 타임아웃·취소로 끝난 경우.
      # ⚠️ failure()만 두면 timeout-minutes를 넘겨 cancelled로 끝났을 때 이 스텝을
      # 건너뛴다 — 커밋도 없고 이슈도 없이 사이트만 조용히 낡는다.
      - name: 실패 알림
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify.sh "🔴 뉴스 수집 실패" \
            "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 회차가 실패했습니다.

          실행 로그: $RUN

          실패한 스텝을 로그에서 확인하세요. 자주 나오는 원인:
          - \`변경분 커밋\` 실패 → 수집물에 섞인 시크릿으로 push 거부(GH013).
            \`news/core/redact.py\`에 패턴을 추가해 마스킹으로 풉니다.
            unblock URL로 허용 처리하지 마세요 (SPEC '하지 말 것')."

      # exit 0이지만 게시 건수가 임계 미만인 경우 — 실패 알림이 못 잡는 사각지대.
      - name: 열화 알림
        if: success() && steps.build.outputs.degraded == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify.sh "🟡 게시 건수 급감" \
            "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 회차는 성공했지만 **${{ steps.build.outputs.published }}건**만 게시됐습니다.

          실행 로그: $RUN

          확인할 것:
          - \`[summarizer]\` 성공 건수 — 요약 한도(429)에 걸리면 일부만 게시됩니다 (SPEC 1.6)
          - \`[깔때기]\` 후보 수 — 키워드 필터가 과하게 자르고 있을 수 있습니다
          - \`[seen]\` 제외 건수 — 이미 소개한 기사가 많으면 후보가 마릅니다

          임계값은 config.yaml의 \`alert.min_published\`입니다."

      # 켜진 출처가 연속 회차 0건 — 다른 출처가 top_n을 채우면 열화 알림이 못 잡는다.
      # HTML 파싱 출처(github·trendshift·anthropic)는 화면이 바뀌면 조용히 0건이 된다.
      - name: 출처 침묵 알림
        if: success() && steps.build.outputs.silent != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bash scripts/notify.sh "🟡 출처 침묵" \
            "$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 회차 기준 연속 0건인 출처: **${{ steps.build.outputs.silent }}**

          실행 로그: $RUN

          확인할 것:
          - 로그의 \`[<출처>] 실패\`(요청 실패)인지 \`[<출처>] 0개 수집\`(파싱 0건)인지
          - HTML 파싱 출처면 상대 사이트 화면이 바뀐 것 — news/scrapers/ 의 해당 파일 셀렉터를 손본다
          - 이력은 data/source_health.json, 임계는 config.yaml의 \`alert.silent_streak\`"
