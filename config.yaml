    # ⚠️ 차단어가 있어도 개발 키워드가 하나라도 같이 있으면 남긴다. 그래서
    # 'AI로 암 진단' 같은 기사는 안 걸린다 — 개발 어휘가 전혀 없는 글만 걸린다.
