  # 한국어 개발 어휘 (filter-nondev-articles).
  # 이 목록에 한국어가 하나도 없어서 긱뉴스 한국어 제목이 통과할 수 없었고,
  # 그래서 TRUSTED 면제가 필요했다. 차단 필터의 구제 조건으로도 쓰인다 —
  # 이게 없으면 `FedEx 피싱`(보안)·`경찰국가에 악용될 기술`(개발자 윤리) 같은
  # 한국어 개발 글이 차단어에 걸려 빠진다. 실측으로 오탐 2건이 이걸로 사라졌다.
