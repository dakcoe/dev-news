# 수집 설정 — 여기만 고치면 됩니다.

sources:
  hackernews: true
  github: true
  trendshift: true   # trendshift.io 일간 순위. github 항목으로 합쳐진다 (feed=Trendshift)
  lobsters: true
  devto: true
  geeknews: true
  rss: true
  anthropic: true    # RSS가 없어 news/engineering 페이지를 직접 파싱
  # 비인증 접근은 403으로 막히고, OAuth 키 발급도 막혀 있다 (2026-08-31 실측):
  # prefs/apps 폼은 열리지만 create app 을 누르면 Responsible Builder Policy
  # 안내로 돌아오고 앱이 만들어지지 않는다. 승인을 받으면 .env에
  # REDDIT_CLIENT_ID/SECRET 만 넣으면 켜진다 — 코드는 준비돼 있다.
  reddit: false

# RSS/Atom 피드 — 주소만 추가하면 소스가 늘어난다.
feeds:
  # Anthropic은 공개 RSS가 없어서 뺐습니다 (news/rss.xml, rss.xml 모두 404)
  - name: OpenAI
    url: https://openai.com/news/rss.xml
  - name: Google AI Blog
    url: https://blog.google/technology/ai/rss/
  - name: Hugging Face
    url: https://huggingface.co/blog/feed.xml
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/
  - name: The Decoder
    url: https://the-decoder.com/feed/
  - name: 카카오 기술블로그
    url: https://tech.kakao.com/feed/
  - name: 토스 기술블로그
    url: https://toss.tech/rss.xml
  # SPEC 1.2 수집 확대 — 1B 태그 어휘 도출용 코퍼스 축적이 목적.
  # page: false = candidates 로그에만 기록하고 페이지에는 싣지 않는다.
  # (rss 기본점수 420을 업고 레딧 밈이 페이지에 실린 사고 이후 도입 — corpus-feeds-page-exclusion)
  - name: arXiv cs.AI
    url: https://rss.arxiv.org/rss/cs.AI
    page: false
  - name: arXiv cs.CL
    url: https://rss.arxiv.org/rss/cs.CL
    page: false
  - name: r/LocalLLaMA
    url: https://www.reddit.com/r/LocalLLaMA/.rss
    page: false
    # 레딧은 처음 보는 UA에 즉시 429를 준다 — 실측으로 무작위 UA도 429였다.
    # 오래 써 온 이 문자열만 통과하므로 공용 UA(consolidate-http)를 덮어쓴다.
    # sources.reddit(OAuth 스크래퍼)과는 다른 경로다. 그쪽은 API 승인이 필요해
    # 꺼져 있고, 이건 인증 없이 받는 공개 RSS다.
    user_agent: "dev-news/1.0 (personal feed aggregator)"

# 글이 드문 공식 블로그는 48시간으로 자르면 놓친다. 이 출처들만 창을 늘린다.
# (한 번 실린 글은 seen.json이 막으므로 같은 글이 반복되지는 않는다)
long_window:
  anthropic: 240     # 10일
  rss: 120           # 5일

# [deprecated — SPEC 1.5] 점수는 UI에서 제거됐고 top_n 선별의 정렬 기준으로만 쓰인다.
#   base   = 업보트 개념이 없는 출처에 주는 바닥 점수
#   weight = 과대·과소평가되는 출처를 누르거나 올리는 배수
# GitHub 아이템은 절대 스타 대신 전일 대비 증가량(Δ)이 지표다.
source_base:
  anthropic: 900
  rss: 420
  geeknews: 320
  devto: 60

source_weight:
  github: 0.35       # '오늘 받은 스타'는 수천 단위라 그대로 두면 상위를 독식한다
  hackernews: 1.0
  lobsters: 1.4      # 점수 단위가 작아서 조금 올려준다

# 예약석 — 점수와 무관하게 자리를 보장받고, 동시에 그 수를 넘지도 않는다.
# 나머지 자리(top_n - 예약분 합계)를 다른 출처가 점수순으로 채운다.
#
#   top_n 20, github 5  →  일반 15 + 트렌딩 5 = 20
#   트렌딩 후보가 4건뿐 →  일반 15 + 트렌딩 4 = 19 (일반이 메우지 않는다)
#
# 예전에는 우선권이라 부족분을 일반 기사가 가져가 항상 20건이 됐다.
source_quota:
  github: 5

# LLM 호출 예산 (SPEC 1.6) — Groq 무료 일일 한도(1,000회)를 한 회차 실행이
# 다 소진하지 않도록 실행당 상한을 건다(하루 3회 실행). 로컬 테스트와 Actions가 겹쳐도 안전.
llm:
  max_calls_per_run: 50
  # 빈 값이면 summarizer의 기본 모델(openai/gpt-oss-120b). 환경변수 LLM_MODEL이
  # 있으면 그쪽이 우선한다 — Actions에서 vars.LLM_MODEL로 코드 수정 없이 되돌릴 수 있다.
  model:
  # 호출 간격(초). gpt-oss는 무료 한도(429)에 llama보다 빨리 걸린다 —
  # 2초에서 10건 중 5건이 429였고 8초에서 10/10 성공했다.
  pause_seconds: 6.0

# 조용한 열화 감지 (add-failure-alert). 회차가 exit 0으로 끝나도 게시 건수가
# 이보다 적으면 Actions가 이슈로 알린다 — 요약 한도(429)나 후보 고갈로 몇 건만
# 올라오는 상태는 "실패"로 잡히지 않기 때문이다. top_n(20)의 절반을 기준으로 둔다.
alert:
  min_published: 10

# 페이지 광고 (add-ad-slot).
#   provider: placeholder = 계정 없이 자리만 확인 (외부 스크립트를 부르지 않는다)
#             adsense     = 실제 광고. 승인 후 client·slot을 채우고 바꾼다
#   client 는 ca-pub-숫자, slot 은 숫자여야 한다 — 형식이 어긋나면 광고를 끈다.
# 광고는 기사 사이가 아니라 피드 오른쪽 레일에 붙는다. 1200px 미만 화면에서는
# 아예 그리지 않는다 — 피드를 좁히면서까지 넣을 자리가 아니다.
ads:
  enabled: false
  provider: placeholder
  client: ""            # 예: ca-pub-1234567890123456
  slot: ""              # 애드센스에서 만든 광고 단위 ID
  count: 1              # 오른쪽 레일에 세로로 쌓을 개수 (최대 3)

# 무료 API 목록의 링크 생존 확인 (api-link-health).
# public-apis README에는 도메인이 사라진 항목이 그대로 남아 있다 — 실측 8%.
# 2,000여 건을 매 회차 전부 두드리지 않고 per_run 만큼 회전 확인하며,
# 결과는 data/api_health.json 에 누적된다(하루 3회 실행 → 한 바퀴 ≈ 하루).
apis:
  health:
    enabled: true
    per_run: 600          # 한 회차에 확인할 URL 수
    workers: 24           # 동시 요청 수
    timeout: 8            # 응답 대기(초)
    threshold: 2          # 연속 이 횟수만큼 죽어야 목록에서 뺀다
    max_drop_ratio: 0.3   # 한 소스에서 이 비율을 넘게 빠지면 필터를 건너뛴다

scraper:
  top_n: 20          # 한 회차에 새로 추가할 기사 수
  # LLM 분류 게이트 (llm-relevance-gate). 요약 호출에 `분류: 게재/제외` 필드를
  # 하나 더 받아 기술 밖 사건(소송·판결·일자리·교육)을 뺀다. 추가 호출은 0회다.
  #
  # 기본 꺼짐 — 무료 gpt-oss-120b의 판정이 아직 안정적이지 않다. 실측 12건 중
  # 9건 일치였고, 프롬프트를 조금만 손대도 분포가 통째로 흔들렸다(전부 게재로
  # 기울거나 전부 주변으로 기울었다). 켜기 전에 LLM_MODEL을 바꿔 재보는 편이 낫다.
  # 끄면 overpick도 0이 되어 동작이 도입 전과 완전히 같다.
  relevance_gate: false
  # 게이트가 `제외`를 빼므로 이만큼 더 뽑아 둔다. 요약은 top_n이 차는 즉시
  # 멈추므로, 제외가 0건인 회차의 호출 수는 여유분과 무관하게 top_n과 같다.
  overpick: 5
  keep_days: 30      # [표시 계층] index.html에 굽는 기간. 저장은 월별 샤드에 무제한 누적 (SPEC 2.1)
  # max_items: 300   # [deprecated — SPEC 2.1] 저장 상한 제거. 샤딩이 용량을 통제한다
  per_source: 5      # 한 출처가 차지할 수 있는 최대 개수 (source 단위: rss 전체)
  # 한 피드가 배치당 차지할 수 있는 최대 개수 (feed 단위: The Decoder 하나).
  # per_source는 source 단위라 rss 5칸을 어느 매체가 가져가는지 통제하지 못했다 —
  # 글을 많이 쓰는 곳이 후보 수로 이겨 최근 10배치 rss 43건 중 The Decoder가
  # 30건(70%)이었다. feed 키가 있는 rss·anthropic에만 걸린다.
  per_feed_page: 2
  window_hours: 48   # 최근 몇 시간 내 발행분만
  hn_limit: 60       # HN 상위 몇 개를 훑을지
  per_feed: 8        # RSS 피드 하나당 몇 개까지
  per_source_fetch: 30

  devto_tags:
    - javascript
    - python
    - ai
    - webdev
    - typescript
    - rust
    - go
    - devops
    - security

  subreddits:
    - LocalLLaMA
    - ClaudeAI
    - MachineLearning
    - programming
    - singularity
    - devops

# 아래 키워드가 제목·설명에 하나도 없으면 제외한다.
# github / devto / geeknews / rss / anthropic은 이미 개발 전용이라 필터를 적용하지 않는다.
#
# 매칭은 단어경계 기준이다 (build.py `_keyword_re`). 부분문자열이 아니므로
# "said"가 ai에, "ago"가 go에 걸리지 않는다. 복수·시제 어미는 자동으로 받아주니
# containers·released처럼 활용형을 따로 적을 필요가 없다.
#
# 짧고 흔한 영어 단어(rest·data·set 등)는 넣지 말 것 — 단어경계로도 못 막는다.
# 비개발 주제 차단 (filter-nondev-articles).
# 화이트리스트(keywords)는 TRUSTED 출처를 면제하는데 — 위 키워드에 한국어가
# 하나도 없어서 긱뉴스 한국어 제목이 통과할 수 없기 때문이다 — 그 면제 때문에
# 개발과 무관한 기사가 그대로 실렸다. 그래서 차단은 TRUSTED에도 적용한다.
#
# 차단어가 있어도 위 keywords가 하나라도 같이 걸리면 남긴다.
#   "캘리포니아주 의회, 연령 확인법에서 Linux를 만장일치로 면제" → linux로 생존
#
# 한국어는 단어경계가 없어 부분문자열로 매칭된다. 다른 말에 파묻히는 모호어는
# 넣지 말 것 — `배우`는 `배우다`에, `사찰`은 문맥이 갈린다. 실측에서 걸렸다.
# 영어는 단어경계로 막는다 — 경계가 없으면 `war`가 `software`에 걸린다.
