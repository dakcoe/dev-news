<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>개발·AI 뉴스 · __DATE__</title>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<style>
  :root{
    --bg:#f4f4f6; --panel:#fff; --rail:#fafafb;
    --line:#e7e7ec; --line2:#f0f0f4;
    --tx:#1c1c22; --tx2:#54545f; --tx3:#8b8b98;
    --pri:#7c6ee6; --pri-bg:#efedfd; --pri-dk:#5b4fd0;
    --hot:#e0507a; --hot-bg:#fdeef2; --new:#22262e;
    --hn:#ff6600; --gh:#1f2328; --lob:#ac130d; --devto:#3b49df;
    --media:#6b5bd2; --rd:#ff4500; --gn:#2f7de0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--tx);
    font-family:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",
                -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:16px; line-height:1.7; letter-spacing:-.008em;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    word-break:keep-all; overflow-wrap:anywhere;
    display:flex; height:100%;
  }
  button{font-family:inherit}

  /* ---------------- rail ---------------- */
  .rail{
    width:74px;flex:none;background:var(--rail);border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:center;padding:16px 0;gap:8px;
  }
  .rb{
    width:50px;height:50px;border-radius:13px;border:none;background:transparent;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    color:#9a9aa8;transition:.14s;position:relative;
  }
  .rb:hover{background:#eeeef3;color:var(--tx2)}
  .rb.on{background:var(--pri-bg);color:var(--pri-dk)}
  .rb svg{width:25px;height:25px;stroke-width:1.9}
  .rb .dot{position:absolute;top:6px;right:6px;width:7px;height:7px;border-radius:50%;
           background:var(--pri);display:none}
  .rb.has .dot{display:block}

  /* ---------------- main ---------------- */
  .wrap{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
  .scroll{flex:1;overflow-y:auto;scrollbar-gutter:stable;padding:34px 34px 70px}
  .inner{max-width:1180px;margin:0 auto}

  h1{font-size:27px;font-weight:800;letter-spacing:-.035em;margin-bottom:6px}
  .sub{font-size:15px;color:var(--tx3);margin-bottom:26px}

  /* 수집 상태 */
  .status{
    display:flex;align-items:center;gap:20px;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:16px 20px;margin-bottom:26px;
  }
  .stmeta{font-size:14.5px;color:var(--tx2);line-height:1.65}
  .stmeta b{color:var(--tx);font-weight:700}
  .stmeta .l2{color:var(--tx3);font-size:13.5px}

  /* 필터 바 */
  .bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .search{
    position:relative;flex:1;min-width:200px;max-width:280px;
  }
  .search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);
              width:16px;height:16px;color:var(--tx3);stroke-width:2}
  .search input{
    width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;
    padding:10px 12px 10px 36px;font-size:14.5px;font-family:inherit;color:var(--tx);
    outline:none;transition:.14s;
  }
  .search input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,110,230,.12)}
  .segs{display:flex;gap:2px;background:#ebebf0;border-radius:10px;padding:3px}
  .sg{border:none;background:transparent;color:var(--tx2);font-size:14px;font-weight:600;
      padding:7px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;transition:.13s}
  .sg:hover{color:var(--tx)}
  .sg.on{background:var(--panel);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.07);font-weight:700}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px}
  /* 카드 태그는 표시 전용 — 클릭 필터 토글 제거 (remove-card-tag-filter-click) */
  .tg{border:none;background:#f0f0f5;color:var(--tx3);font-size:11.5px;font-weight:600;
      padding:2px 8px;border-radius:6px;font-family:inherit;display:inline-block}
  .tg.hit{background:#e9e5fb;color:#6a5cd8}
  .row.rd .tg{opacity:.55}

  /* ---------------- 태그 패싯 사이드바 (시안 F) + 모바일 드로어 (시안 I) ---------------- */
  .layout{display:flex;gap:16px;align-items:flex-start}
  .feed{flex:1;min-width:0}
  .facet{
    flex:0 0 200px;position:sticky;top:12px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:12px 8px;
    max-height:calc(100vh - 24px);overflow-y:auto;
  }
  .fhead{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 7px}
  .fhead .ft{font-size:12.5px;font-weight:800}
  #tagfold{border:none;background:none;font-family:inherit;font-size:11.5px;font-weight:700;
    color:var(--tx3);cursor:pointer;padding:2px 4px;border-radius:6px}
  #tagfold:hover{color:var(--tx);background:#f4f3fb}
  .fgh{font-size:10.5px;font-weight:800;color:var(--tx3);letter-spacing:.09em;margin:8px 8px 3px}
  .fitem{
    display:flex;align-items:center;gap:8px;width:100%;padding:5px 8px;border-radius:8px;
    border:none;background:none;font-family:inherit;font-size:12.5px;color:var(--tx);
    cursor:pointer;text-align:left;position:relative;overflow:hidden;
  }
  .fitem:hover{background:#f4f3fb}
  .fitem .fill{position:absolute;left:0;top:0;bottom:0;background:#f1effc;border-radius:8px;z-index:0}
  .fitem.on .fill{background:#e4dffa}
  .fitem>*{position:relative;z-index:1}
  .fitem .rdo{width:14px;height:14px;border-radius:50%;border:1.6px solid #c9c9d4;background:#fff;flex:none}
  .fitem.on .rdo{border:4.5px solid var(--pri)}
  .fitem .sq{width:8px;height:8px;border-radius:2.5px;flex:none}
  .fitem .ckm{width:14px;height:14px;border:1.6px solid #c9c9d4;border-radius:4px;background:#fff;
    display:inline-flex;align-items:center;justify-content:center;flex:none}
  .fitem .ckm svg{width:9px;height:9px;color:#fff;stroke-width:3.4;display:none}
  .fitem.on .ckm{background:var(--pri);border-color:var(--pri)}
  .fitem.on .ckm svg{display:block}
  .fitem .fn{margin-left:auto;color:var(--tx3);font-size:11px;font-variant-numeric:tabular-nums}
  .ffoot{border-top:1px solid var(--line2);margin-top:8px;padding:7px 8px 2px;
    display:flex;justify-content:space-between;font-size:12px}
  .ffoot .fsel{color:var(--pri);font-weight:700}
  .ffoot button{border:none;background:none;font-family:inherit;font-size:12px;font-weight:700;
    cursor:pointer;color:var(--tx3)}
  .ffoot button:hover{color:var(--tx)}
  /* 커스텀 드롭다운 */
  .ddwrap{position:relative}
  .dd{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:var(--panel);border-radius:10px;padding:9px 13px;font-size:14px;
    font-weight:600;color:var(--tx);font-family:inherit;cursor:pointer;transition:.13s;
  }
  .dd:hover{border-color:#cfcfd8}
  .dd.open{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,110,230,.12)}
  .dd svg{width:12px;height:12px;stroke-width:2.4;color:var(--tx3)}
  .ddpop{
    position:absolute;top:calc(100% + 6px);left:0;z-index:40;min-width:132px;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    box-shadow:0 10px 28px rgba(20,20,45,.13);padding:5px;
    display:flex;flex-direction:column;
  }
  .dditem{
    display:flex;align-items:center;gap:8px;border:none;background:none;
    font-family:inherit;font-size:13.5px;color:var(--tx);padding:8px 10px;
    border-radius:8px;cursor:pointer;text-align:left;white-space:nowrap;
  }
  .dditem:hover{background:#f4f3fb}
  .dditem.on{color:var(--pri);font-weight:700}
  .dditem .rdo{width:13px;height:13px;border-radius:50%;border:1.6px solid #c9c9d4;background:#fff;flex:none}
  .dditem.on .rdo{border:4px solid var(--pri)}

  /* 필터 버튼 — 검색 바로 옆(좌측), 처음부터 보라색, 호버 시 더 어둡게.
     .cp 기본 규칙이 이 아래에 정의되므로 .cp.tagcp로 특이도를 올려 이긴다. */
  .cp.tagcp{
    background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700;gap:6px;
    padding:9px 13px;font-size:14px;      /* 드롭다운(.dd)과 같은 크기 */
  }
  .cp.tagcp svg{width:14px;height:14px;stroke-width:2}
  .cp.tagcp:hover{background:#6152cc;border-color:#6152cc;color:#fff}
  .tagcp .bn{background:rgba(255,255,255,.25);color:#fff;font-size:11px;font-weight:700;
    border-radius:10px;padding:0 6px;min-width:18px;text-align:center}
  .scrim{position:fixed;inset:0;background:rgba(20,20,35,.32);z-index:59}
  @media (min-width:901px){
    .layout.fc .facet{display:none}          /* 접힘: 피드가 전체 폭 사용 */
  }
  @media (max-width:900px){
    #tagfold{display:none}                   /* 드로어는 스크림 클릭으로 닫는다 */
    .facet{
      position:fixed;left:0;top:0;bottom:0;width:240px;max-height:none;z-index:60;
      border-radius:0 14px 14px 0;transform:translateX(-105%);transition:.22s;
      box-shadow:8px 0 28px rgba(20,20,45,.14);
    }
    .facet.open{transform:none}
  }
  @media (prefers-reduced-motion:reduce){ .facet{transition:none} }

  /* ---------------- API 카탈로그 (api-category-hub): 허브 → 항목 아코디언 ---------------- */
  .cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;margin-bottom:18px}
  .ccard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;
         display:flex;flex-direction:column;gap:5px;cursor:pointer;text-align:left;font-family:inherit;transition:.13s}
  .ccard:hover{border-color:#d6d6e0;box-shadow:0 2px 6px rgba(20,20,40,.05)}
  .chd{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .cic{width:30px;height:30px;border-radius:9px;background:var(--pri-bg);color:var(--pri-dk);
       display:flex;align-items:center;justify-content:center;flex:none}
  .cic svg{width:17px;height:17px;stroke-width:1.9}
  .ghead{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;
         letter-spacing:-.02em;margin:22px 2px 10px}
  .gdot{width:9px;height:9px;border-radius:3px;flex:none}
  .ghead .gn{font-size:11.5px;color:var(--tx3);font-weight:600;font-variant-numeric:tabular-nums}
  .cmeta{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
  .cfree{font-size:10.5px;padding:0 6px;border-radius:99px;background:#e7f6ec;color:#1f7a3d;font-weight:600;white-space:nowrap}
  .cname{font-size:14.5px;font-weight:700;letter-spacing:-.02em}
  .cprev{font-size:11.5px;color:var(--tx3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;
         -webkit-box-orient:vertical;overflow:hidden}
  .aback{border:none;background:none;font-family:inherit;font-size:13px;font-weight:700;color:var(--tx3);
         cursor:pointer;padding:2px 4px;border-radius:6px;margin-bottom:10px}
  .aback:hover{color:var(--tx);background:#f4f3fb}
  .cathead{font-size:18px;font-weight:800;letter-spacing:-.03em;margin-bottom:2px}
  .catsub{font-size:12.5px;color:var(--tx3);margin-bottom:12px}
  .aitem{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;overflow:hidden}
  .aitem.open{border-color:var(--pri);box-shadow:0 0 0 3px rgba(124,110,230,.1)}
  .aihead{display:flex;align-items:center;gap:8px;padding:10px 14px;cursor:pointer}
  .aihead:hover{background:#fafafc}
  .aihead .cv{width:14px;height:14px;color:var(--tx3);flex:none;transition:.14s}
  .aitem.open .aihead .cv{transform:rotate(90deg);color:var(--pri-dk)}
  .aihead .an{font-size:13.5px;font-weight:700;letter-spacing:-.015em;white-space:nowrap}
  .aihead .ap{font-size:12px;color:var(--tx3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
  .aibody{padding:2px 14px 12px 36px;border-top:1px solid var(--line2)}
  .aibody .ad{font-size:13px;color:var(--tx2);line-height:1.65;padding-top:8px}
  .agoto{display:inline-flex;align-items:center;gap:6px;margin-top:9px;border:1px solid var(--line);
         background:var(--panel);border-radius:8px;padding:5px 12px;font-size:12.5px;font-weight:700;
         color:var(--tx2);text-decoration:none}
  .agoto:hover{border-color:var(--pri);color:var(--pri-dk)}
  .agoto svg{width:12px;height:12px;stroke-width:2}
  .abadge{font-size:11px;padding:1px 7px;border-radius:99px;background:#f0f0f4;color:#6b6b78;white-space:nowrap;flex:none}
  .abadge.free{background:#e7f6ec;color:#1f7a3d}
  .akr{font-size:10px;font-weight:800;padding:1px 6px;border-radius:5px;background:#2f7de0;color:#fff;flex:none}
  .cp{
    display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);
    background:var(--panel);color:var(--tx2);padding:7px 14px;border-radius:9px;
    font-size:14px;font-weight:600;cursor:pointer;transition:.13s;white-space:nowrap;
  }
  .cp:hover{border-color:#cfcfd8;color:var(--tx)}
  .cp.on{background:var(--tx);border-color:var(--tx);color:#fff}
  .cp.on .n{color:rgba(255,255,255,.55)}
  .cp .sq{width:8px;height:8px;border-radius:2.5px}
  .cp .n{font-size:12.5px;color:var(--tx3);font-weight:600}
  .cp .ckm{width:16px;height:16px;border:1.8px solid #c9c9d4;border-radius:5px;background:#fff;
           display:inline-flex;align-items:center;justify-content:center;transition:.12s}
  .cp .ckm svg{width:11px;height:11px;color:#fff;stroke-width:3.2;display:none}
  .cp.on .ckm{background:var(--pri);border-color:var(--pri)}
  .cp.on .ckm svg{display:block}

  /* ---------------- rows (카드형 — 오른쪽 썸네일) ---------------- */
  .group{font-size:13px;font-weight:700;color:var(--tx3);margin:18px 2px 10px}
  .row{
    display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:0 14px;
    background:var(--panel);border:1px solid var(--line);border-radius:14px;
    padding:18px 18px 18px 16px;margin-bottom:10px;transition:.13s;align-items:start;
  }
  .row:hover{border-color:#d6d6e0;box-shadow:0 2px 6px rgba(20,20,40,.05)}
  .row.act{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri) inset}
  .ck{
    width:19px;height:19px;border:1.8px solid #c9c9d4;border-radius:6px;background:#fff;
    cursor:pointer;margin-top:4px;flex:none;display:flex;align-items:center;
    justify-content:center;transition:.12s;padding:0;visibility:hidden;
  }
  .row:hover .ck,.ck.on{visibility:visible}   /* 호버 시에만 노출, 체크된 건 항상 */
  @media (hover:none){ .ck{visibility:visible} }
  .ck:hover{border-color:var(--pri)}
  .ck.on{background:var(--pri);border-color:var(--pri)}
  .ck svg{width:12px;height:12px;color:#fff;stroke-width:3;display:none}
  .ck.on svg{display:block}

  .mid{min-width:0;cursor:pointer}
  .rt{font-size:17.5px;font-weight:700;line-height:1.52;letter-spacing:-.025em;
      margin-bottom:7px;text-wrap:pretty;display:inline}
  .rm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13.5px;
      color:var(--tx3);margin:8px 0}
  .rm .s{font-weight:700}
  .rm .sep{color:#c9c9d4}
  .rm .num{font-variant-numeric:tabular-nums;font-weight:600;color:var(--tx2)}
  .snip{font-size:14.8px;color:#66666f;line-height:1.72;
        display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .thumb{width:88px;height:66px;border-radius:9px;overflow:hidden;border:1px solid var(--line2);
         flex:none;background:#f0f0f4}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .acts{display:flex;flex-direction:column;gap:6px;padding-top:2px}
  .ib{width:32px;height:32px;border-radius:9px;border:none;background:transparent;color:#a8a8b5;
      display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.13s}
  .ib:hover{background:#f0f0f5;color:var(--tx2)}
  .ib svg{width:16px;height:16px;stroke-width:2}

  /* 읽은 기사 */
  .row.rd{background:#fbfbfc}
  .row.rd .rt{color:#9b9ba7;font-weight:600}
  .row.rd .snip{color:#a9a9b4}
  .row.rd .thumb{opacity:.45}
  .ib.done{color:var(--pri)}

  .none{text-align:center;padding:70px 20px;color:var(--tx3);font-size:15px}
  .archead{font-size:13px;font-weight:700;color:var(--tx3);margin:22px 2px 10px}

  /* ---------------- detail ---------------- */
  .dt{
    position:fixed;top:0;right:0;bottom:0;width:min(620px,94vw);background:var(--panel);
    z-index:80;transform:translateX(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);
    display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(20,20,40,.14);
  }
  .dt.open{transform:none}
  .dh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex:none}
  .dh .x{width:34px;height:34px;border-radius:9px;border:none;background:#f2f2f6;color:var(--tx2);
         cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center}
  .dh .x:hover{background:#e9e9ef}
  .dh .t{font-size:14px;font-weight:700;color:var(--tx3)}
  .db{flex:1;overflow-y:auto}
  .hero{width:100%;height:200px;object-fit:cover;display:block;background:#f0f0f4}
  .dc{padding:26px 32px 46px;max-width:44em}
  .dc h2{font-size:24.5px;font-weight:800;line-height:1.45;letter-spacing:-.032em;
         margin-bottom:14px;text-wrap:pretty}
  .dmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;font-size:14px;color:var(--tx3);
         padding-bottom:18px;margin-bottom:24px;border-bottom:1px solid var(--line)}
  .dc p{font-size:16.5px;color:#2c2c33;margin-bottom:20px;line-height:1.95;letter-spacing:-.01em}
  .why{background:#f7f6fe;border:1px solid #e6e2fb;border-radius:11px;padding:17px 19px;
       margin:26px 0;font-size:15.5px;color:#3a3a44;line-height:1.82}
  .why b{display:block;font-size:12.5px;font-weight:800;color:var(--pri-dk);
         letter-spacing:.06em;margin-bottom:6px}
  code{background:#f2f2f6;border:1px solid var(--line);padding:1.5px 6px;border-radius:5px;
       font-size:14.5px;font-family:"SF Mono",Consolas,monospace;color:#6b4bd0}
  .go{display:inline-flex;align-items:center;gap:8px;background:var(--tx);color:#fff;
      text-decoration:none;font-size:15px;font-weight:700;padding:12px 20px;border-radius:10px}
  .go:hover{background:#000}

  /* ---------------- sources view ---------------- */
  .scard{background:var(--panel);border:1px solid var(--line);border-radius:14px;
         padding:20px 22px;margin-bottom:12px;display:flex;gap:16px;align-items:flex-start}
  .scard .sn{font-size:17px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:8px}
  .scard .sd{font-size:14.5px;color:var(--tx3);line-height:1.7}
  .tglb{width:44px;height:25px;border-radius:99px;background:var(--pri);position:relative;flex:none;margin-left:auto}
  .tglb::after{content:"";position:absolute;top:3px;left:22px;width:19px;height:19px;border-radius:50%;background:#fff}
  .tglb.off{background:#d9d9e2}
  .tglb.off::after{left:3px}
  .cnt{font-size:13px;font-weight:700;color:var(--pri-dk);background:var(--pri-bg);
       padding:3px 9px;border-radius:7px}

  .expbtn{display:inline-flex;align-items:center;gap:8px;background:var(--tx);color:#fff;border:none;
          font-size:14.5px;font-weight:700;padding:11px 18px;border-radius:10px;cursor:pointer;margin-bottom:18px}
  .expbtn:hover{background:#000}

  @media (max-width:820px){
    /* 하단 내비 높이(58px)만큼 스크롤 여백 확보 */
    .scroll{padding:22px 16px 88px}
    /* 전체 스케일 축소 — 한 화면에 카드 여러 장이 보이게. body가 아니라 .inner에
       거는 이유: fixed 요소(.rail·.dt·.facet)가 zoom을 물려받으면 좌표가 틀어진다 */
    .inner{zoom:.8}
    h1{font-size:23px}
    /* .acts를 옆 칸에 두면 본문(.mid)이 100px 이하로 쪼그라든다 —
       카드 하단 전체 폭 행으로 내려 본문이 1fr을 전부 쓰게 한다 */
    .row{grid-template-columns:auto minmax(0,1fr);padding:15px}
    .thumb{display:none}
    .acts{grid-column:1/-1;flex-direction:row;justify-content:flex-end;gap:2px;
          padding-top:8px;margin-top:4px;border-top:1px solid var(--line2)}
    .dc{padding:22px 20px 40px}
    /* 좌측 레일(74px)은 좁은 화면에서 폭 19%를 먹는다 — 하단 내비로 전환 */
    .rail{position:fixed;left:0;right:0;bottom:0;top:auto;width:auto;height:58px;
          flex-direction:row;justify-content:space-around;align-items:center;padding:0;gap:0;
          border-right:none;border-top:1px solid var(--line);z-index:70}
    .rb{width:46px;height:46px}
    .facet{bottom:58px}     /* 태그 드로어가 하단 내비를 가리지 않게 */
  }
</style>
</head>
<body>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h11a1 1 0 011 1v12a2 2 0 002 2H5a1 1 0 01-1-1V5z"/><path d="M16 8h3a1 1 0 011 1v9a2 2 0 01-2 2"/><path d="M7 8h6M7 12h6M7 16h4"/></svg>

<div class="wrap">
  <div class="scroll"><div class="inner" id="view"></div></div>
</div>

<aside class="dt" id="dt">
  <div class="dh">
    <button class="x" onclick="closeDetail()">✕</button>
    <span class="t">기사 상세</span>
  </div>
  <div class="db" id="db"></div>
</aside>

<script>
const COLLECTED = "__COLLECTED__";
const COLLECTED_LABEL = "__COLLECTED_LABEL__";

const SRC = __SRC_JSON__;
const TAGS = __TAG_JSON__;   // 닫힌 태그 어휘 id → 한글 라벨 (SPEC 1B)

const DATA = __DATA_JSON__;

/* ---------------- state ---------------- */
let view='news', sort='batch', filter='all', q='', days=0, unreadOnly=false;   // days=0 이면 전체
/* 태그 필터 (SPEC 3.3 — 태그가 1차 필터, 다중 선택(OR), localStorage에 저장해 재방문 시 복원) */
const TAGSEL_KEY='dev-news-tagsel';
const tagSel = new Set();
let facetOpen = false;                 // 좁은 화면 드로어 열림 상태
try{
  const raw = localStorage.getItem(TAGSEL_KEY);
  if(raw) JSON.parse(raw).forEach(t=>{ if(TAGS[t]) tagSel.add(t); });
  else{
    // 구 단일 선택 키(dev-news-tagfilter) 마이그레이션
    const old = localStorage.getItem('dev-news-tagfilter');
    if(old && TAGS[old]) tagSel.add(old);
  }
}catch(e){}
function persistTags(){ try{ localStorage.setItem(TAGSEL_KEY, JSON.stringify([...tagSel])); }catch(e){} }
let openDrop=null;                     // 열려 있는 커스텀 드롭다운 id (렌더 간 비유지)
document.addEventListener('click', ()=>{ if(openDrop){ openDrop=null; render(); } });

/* 사이드바 접힘 상태 (데스크톱) — 재방문 시 유지 */
const FOLD_KEY='dev-news-facetfold';
let facetFold=false;
try{ facetFold = localStorage.getItem(FOLD_KEY)==='1'; }catch(e){}
function setFold(v){ facetFold=v; try{ localStorage.setItem(FOLD_KEY, v?'1':'0'); }catch(e){} render(); }
function toggleTag(t){ tagSel.has(t) ? tagSel.delete(t) : tagSel.add(t); persistTags(); render(); }
function tagLabel(t){ return (TAGS[t]||{}).label || t; }
const read = new Set();
const SAVE_KEY='dev-news-saved';
const READ_KEY='dev-news-read';

/* 보관함 스냅샷 (SPEC 2.5): url → {url, title, month}
   기존 URL 배열은 최초 로드 시 객체로 승격. DATA에 없는 옛 URL은 제목을 URL로 유지. */
const savedMap = new Map();
try{
  const raw = JSON.parse(localStorage.getItem(SAVE_KEY) || '[]');
  raw.forEach(item=>{
    if(typeof item === 'string'){
      const d = DATA.find(x=>x.url===item);
      savedMap.set(item, {url:item, title: d?d.title:item, month: d?d.month:''});
    } else if(item && item.url){
      savedMap.set(item.url, {url:item.url, title:item.title||item.url, month:item.month||''});
    }
  });
}catch(e){}
try{ const r=localStorage.getItem(READ_KEY); if(r) JSON.parse(r).forEach(u=>read.add(u)); }catch(e){}

function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify([...savedMap.values()])); }catch(e){} }
function persistRead(){
  // 목록에서 사라진 기사까지 무한정 쌓이지 않도록 최근 1000건만 유지
  try{ localStorage.setItem(READ_KEY, JSON.stringify([...read].slice(-1000))); }catch(e){}
}
function markRead(url){ if(!read.has(url)){ read.add(url); persistRead(); } }
function toggleRead(i){
  const u=DATA[i].url;
  read.has(u) ? read.delete(u) : read.add(u);
  persistRead(); render();
}
function toggleSave(d){
  if(savedMap.has(d.url)) savedMap.delete(d.url);
  else savedMap.set(d.url, {url:d.url, title:d.title, month:d.month||''});
  persist(); render();
}

const viewEl=document.getElementById('view');
const I={
  ext:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 01-1 1H5a1 1 0 01-1-1V7a1 1 0 011-1h5"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 5h16M4 10h16M4 15h10"/></svg>',
  chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M4 12l5 5L20 6"/></svg>',
  sch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M2 12s3.6-6 10-6 10 6 10 6-3.6 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="2.6"/></svg>'
};

function ago(iso){
  const d=(Date.now()-new Date(iso))/1000;
  if(d<3600) return Math.max(1,Math.round(d/60))+'분 전';
  if(d<86400) return Math.round(d/3600)+'시간 전';
  return Math.round(d/86400)+'일 전';
}
function batches(){ return [...new Set(DATA.map(d=>d.batchLabel).filter(Boolean))]; }
function latestCount(){
  const b=batches()[0];
  return b ? DATA.filter(d=>d.batchLabel===b).length : DATA.length;
}
function isNew(iso){ return (Date.now()-new Date(iso)) < 26*3600*1000; }

function sorted(items){
  const a=[...items];
  if(sort==='batch') a.sort((x,y)=> (y.batch||'').localeCompare(x.batch||'') || (y.score||0)-(x.score||0));
  if(sort==='new')   a.sort((x,y)=>new Date(y.pub)-new Date(x.pub));
  if(sort==='src')   a.sort((x,y)=>x.src.localeCompare(y.src)||(y.score||0)-(x.score||0));
  return a;
}
function inDays(d, n){
  if(!n) return true;
  const t = d.batch ? new Date(d.batch) : new Date(d.pub);
  return (Date.now() - t) < n*24*3600*1000;
}
function visible(){
  let a=DATA.map((d,i)=>({...d,i}));
  if(view!=='saved') a=a.filter(d=>inDays(d, days));
  if(unreadOnly) a=a.filter(d=>!read.has(d.url));
  if(filter!=='all') a=a.filter(d=>d.src===filter);
  if(tagSel.size) a=a.filter(d=>(d.tags||[]).some(t=>tagSel.has(t)));   // 다중 선택 = OR
  if(q){ const s=q.toLowerCase();
    a=a.filter(d=>(d.title+d.snip+d.from+(d.tags||[]).map(tagLabel).join(' ')).toLowerCase().includes(s)); }
  return sorted(a);
}

function rowHTML(d){
  const s=SRC[d.src]||{name:d.src,color:'#999'};
  let meta='<span class="s" style="color:'+s.color+'">'+(d.from||s.name)+'</span>';
  if(d.src==='github' && d.delta) meta+='<span class="sep">·</span><span class="num">+'+d.delta.toLocaleString()+'</span>';
  meta+='<span class="sep">·</span><span>'+ago(d.pub)+'</span>';
  if(d.cm) meta+='<span class="sep">·</span><span class="num">'+d.cm+'댓글</span>';
  (d.tags||[]).slice(0,4).forEach(t=>{
    meta+='<span class="tg'+(tagSel.has(t)?' hit':'')+'">'+tagLabel(t)+'</span>';
  });
  const isRead = read.has(d.url);
  return '<div class="row'+(cur===d.i?' act':'')+(isRead?' rd':'')+'" data-i="'+d.i+'">'
    + '<button class="ck'+(savedMap.has(d.url)?' on':'')+'" data-ck="'+d.i+'" title="보관">'+I.chk+'</button>'
    + '<div class="mid" data-open="'+d.i+'">'
    +   '<span class="rt">'+d.title+'</span>'
    +   '<div class="rm">'+meta+'</div>'
    +   (d.snip?'<div class="snip">'+d.snip+'</div>':'')
    + '</div>'
    + (d.img?'<div class="thumb"><img src="'+d.img+'" loading="lazy" alt="" onerror="this.closest(\'.thumb\').remove()"></div>':'<div></div>')
    + '<div class="acts">'
    +   '<button class="ib" title="원문 열기" onclick="event.stopPropagation();markRead(\''+d.url+'\');render();window.open(\''+d.url+'\',\'_blank\')">'+I.ext+'</button>'
    +   '<button class="ib" title="번역 요약" data-open="'+d.i+'">'+I.doc+'</button>'
    +   '<button class="ib'+(isRead?' done':'')+'" title="'+(isRead?'안 읽음으로':'읽음으로')+' 표시" '
    +     'onclick="event.stopPropagation();toggleRead('+d.i+')">'+I.eye+'</button>'
    + '</div></div>';
}

/* 아카이브 검색 결과 행 (SPEC 2.4) */
function archRowHTML(e){
  return '<div class="row" data-au="'+e.u+'" data-am="'+e.m+'" style="cursor:pointer">'
    + '<div></div>'
    + '<div class="mid"><span class="rt">'+e.t+'</span>'
    + '<div class="rm"><span class="s">'+((SRC[e.s]||{}).name||e.s)+'</span>'
    + '<span class="sep">·</span><span>'+e.d+'</span></div></div></div>';
}

/* 활성 필터 수 = 패널 항목(태그·출처)만 — 기간·안읽음·정렬은 바에서 직접 보인다 */
function activeFilterCount(){
  return tagSel.size + (filter!=='all'?1:0);
}

/* 통합 필터 패널 (unified-filter-panel): 정렬 · 기간 · 읽음 · 출처 · 태그를 한곳에.
   좁은 화면에서는 같은 마크업이 드로어로 전환된다 (CSS만 다름). */
function facetHTML(){
  const scope = DATA.filter(d=>inDays(d, days));
  const c={}; scope.forEach(d=>(d.tags||[]).forEach(t=>c[t]=(c[t]||0)+1));
  const sc={}; scope.forEach(d=>sc[d.src]=(sc[d.src]||0)+1);
  const max = Math.max(1, ...Object.values(c));
  const groups = {};
  Object.entries(TAGS).forEach(([id,meta])=>{ (groups[meta.group]=groups[meta.group]||[]).push(id); });
  const order = ['AI','개발','그 외'].filter(g=>groups[g])
    .concat(Object.keys(groups).filter(g=>!['AI','개발','그 외'].includes(g)));

  let h='<aside class="facet'+(facetOpen?' open':'')+'" id="facet">'
    +'<div class="fhead"><span class="ft">필터</span>'
    +'<button id="tagfold" title="사이드바 접기">◂ 접기</button></div>';

  h+='<div class="fgh">출처</div>'
    +'<button class="fitem'+(filter==='all'?' on':'')+'" data-f="all">'
    +'<span class="rdo"></span><span class="fl">전체</span><span class="fn">'+scope.length+'</span></button>';
  Object.keys(SRC).filter(k=>sc[k]).forEach(k=>{
    h+='<button class="fitem'+(filter===k?' on':'')+'" data-f="'+k+'">'
      +'<span class="rdo"></span><span class="sq" style="background:'+SRC[k].color+'"></span>'
      +'<span class="fl">'+SRC[k].name+'</span><span class="fn">'+sc[k]+'</span></button>';
  });

  order.forEach(g=>{
    h+='<div class="fgh">태그 · '+g+'</div>';
    groups[g].forEach(t=>{
      const n=c[t]||0;
      // 라벨은 반드시 span으로 감싼다 — 맨몸 텍스트 노드는 .fill 막대에 가려진다
      h+='<button class="fitem'+(tagSel.has(t)?' on':'')+'" data-ft="'+t+'">'
        +'<span class="fill" style="width:'+Math.round(n/max*100)+'%"></span>'
        +'<span class="ckm">'+I.chk+'</span><span class="fl">'+TAGS[t].label+'</span>'
        +'<span class="fn">'+n+'</span></button>';
    });
  });
  h+='<div class="ffoot"><span class="fsel">'+(activeFilterCount()?activeFilterCount()+'개 적용':'')+'</span>'
    +'<button id="tagclear">초기화</button></div></aside>';
  return h;
}

/* 커스텀 드롭다운 — 네이티브 select 대신 디자인 통일 (bar-dropdown-cleanup 피드백) */
function ddHTML(id, cur, opts){
  const curLabel = (opts.find(o=>String(o[0])===String(cur))||opts[0])[1];
  let h='<div class="ddwrap"><button class="dd'+(openDrop===id?' open':'')+'" id="'+id+'">'+curLabel
    +'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M6 9l6 6 6-6"/></svg></button>';
  if(openDrop===id){
    h+='<div class="ddpop">'+opts.map(([v,l])=>
      '<button class="dditem'+(String(cur)===String(v)?' on':'')+'" data-dd="'+id+'" data-v="'+v+'">'
      +'<span class="rdo"></span>'+l+'</button>').join('')+'</div>';
  }
  return h+'</div>';
}

function barHTML(){
  // 바 = 검색 + 필터(좌측·강조색) + 정렬/기간 커스텀 드롭다운 + 안 읽음
  const n = activeFilterCount();
  return '<div class="bar">'
   + '<div class="search">'+I.sch+'<input id="q" placeholder="검색 (아카이브 포함)…" value="'+q.replace(/"/g,'&quot;')+'"></div>'
   + '<button class="cp tagcp'+(n?' has':'')+'" id="tagbtn">'
   +   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 5h18M6 12h12M10 19h4"/></svg>'
   +   '필터'+(n?' <span class="bn">'+n+'</span>':'')+'</button>'
   + ddHTML('sortsel', sort, [['batch','수집순'],['new','최신순'],['src','출처별']])
   + ddHTML('daysel', days, [[1,'오늘'],[3,'3일'],[7,'7일'],[0,'전체 기간']])
   + '<button class="cp'+(unreadOnly?' on':'')+'" id="unread"><span class="ckm">'+I.chk+'</span> 안 읽음</button>'
   + '</div>';
}

let cur=null;

/* ---------------- 아카이브 (SPEC 2.4): 인덱스 1회 fetch, 월 샤드 온디맨드 ---------------- */
let INDEX=null;            // null=미시도, 'fail'=불가(file:// 등), 배열=로드됨
const SHARDS={};
function ensureIndex(){
  if(INDEX!==null) return;
  INDEX='loading';
  fetch('data/search-index.json')
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ INDEX=j; renderList(); })      // 부분 갱신 — 로드 완료가 IME 조합을 끊지 않게
    .catch(()=>{ INDEX='fail'; renderList(); });
}
function archMatches(){
  if(!Array.isArray(INDEX)) return null;
  const s=q.toLowerCase();
  const here=new Set(DATA.map(d=>d.url));
  return INDEX.filter(e=>!here.has(e.u) && (e.t||'').toLowerCase().includes(s)).slice(0,50);
}
/* extra = 목록이 이미 아는 메타(출처·발행시각·댓글수·썸네일). 지연 로딩분의
   상세가 아카이브 검색 결과처럼 빈약해지지 않도록 덮어쓴다. */
function openArchived(url, month, extra){
  const show = list => {
    const a=list.find(x=>x.url===url);
    if(!a){ alert('기사를 찾지 못했습니다.'); return; }
    const body=(a.summary||a.description||'').split('\n').filter(p=>p.trim());
    showDetail(Object.assign({
      title:a.ko_title||a.title, from:(SRC[a.source]||{}).name||a.source,
      color:(SRC[a.source]||{}).color||'#999', pub:null, dateLabel:(a.batch||'').slice(0,10),
      img:a.image, body:body.map(p=>'<p>'+p+'</p>').join('')||'<p>(요약 없음)</p>',
      why:a.why||'', url:a.url
    }, extra||{}));
    markRead(url);
  };
  if(SHARDS[month]){ show(SHARDS[month]); return; }
  fetch('data/articles/'+month+'.json')
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ SHARDS[month]=j; show(j); })
    .catch(()=>alert('아카이브를 불러오지 못했습니다. (로컬 파일로 열면 검색만 가능합니다)'));
}

/* ---------------- API 카탈로그 (api-category-hub) ----------------
   public-apis · 한국판 README 전체를 파싱한 data/apis.json 스냅샷을 첫 진입 때
   fetch한다 (아카이브 샤드와 같은 지연 로딩 패턴). 기사 파이프라인과 무관.
   구조: 카테고리 허브(카드 그리드) → 카테고리 진입(항목 아코디언) / 전역 검색.
   상단 바(h1·검색·세그)는 하위 뷰와 무관하게 동일 마크업 — #apibody만 부분
   갱신해서 허브→검색 전환 중에도 input이 교체되지 않아 한글 IME가 유지된다. */
let APIS=null;                         // null=미시도, 'loading', 'fail', 객체
let apiQ='', apiSrc='all', apiCat=null, apiOpen=-1;   // apiCat='src|cat' 키, apiOpen=현재 목록 내 인덱스
const A_LBL={kr:'한국판', global:'Public APIs', llm:'무료 LLM'};
const escA=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ensureApis(){
  if(APIS!==null) return;
  APIS='loading';
  fetch('data/apis.json')
    .then(r=>{ if(!r.ok) throw 0; return r.json(); })
    .then(j=>{ APIS=j; if(view==='api') render(); })
    .catch(()=>{ APIS='fail'; if(view==='api') render(); });
}

      + '<div class="sub">'+(isSaved
          ? '체크한 기사만 모아둔 곳입니다. 이 브라우저에 저장됩니다.'
          : '매일 00시·08시·16시에 수집합니다. 30일 지난 기사는 검색으로 찾을 수 있습니다 (최근 '+batches().length+'회차)')+'</div>';

  if(isSaved){
    if(savedMap.size) h+='<button class="expbtn" onclick="copyMd()">선택 '+savedMap.size+'건 마크다운으로 복사</button>';
    const items=[...savedMap.values()];
    if(!items.length){
      h+='<div class="none">아직 보관한 기사가 없습니다. 목록에서 체크박스를 눌러보세요.</div>';
    } else {
      items.forEach(sv=>{
        const d=DATA.find(x=>x.url===sv.url);
        if(d) h+=rowHTML({...d, i:DATA.indexOf(d)});
        else h+='<div class="row" data-au="'+sv.url+'" data-am="'+sv.month+'" style="cursor:pointer">'
              +'<button class="ck on" data-un="'+sv.url+'" title="보관 해제">'+I.chk+'</button>'
              +'<div class="mid"><span class="rt">'+sv.title+'</span>'
              +'<div class="rm"><span>'+(sv.month||'아카이브')+'</span></div></div></div>';
      });
    }
    viewEl.innerHTML=h; bind(); return;
  }

  // 상태 카드 (뉴스 수집 버튼 없음)
  h+='<div class="status">'
    +'<div class="stmeta"><b>최근 30일 '+DATA.length+'건</b> · 최근 수집 '+latestCount()+'건 ('+COLLECTED_LABEL+')<br>'
    +'<span class="l2">회차 '+batches().length+'개 · 소스 '+new Set(DATA.map(d=>d.src)).size
    +'곳 · 안 읽음 '+DATA.filter(d=>!read.has(d.url)).length+'건 · 보관 '+savedMap.size+'건</span></div></div>';

  h+=barHTML();
  h+=layoutHTML();

  viewEl.innerHTML=h; bind();
}

/* 레이아웃(패싯 사이드바 + 피드 + 아카이브 결과)만 따로 생성.
   검색 입력 중 부분 갱신에 쓰인다 (fix-search-partial-render). */
function layoutHTML(){
  const items=visible();
  // 레이아웃: 왼쪽 태그 패싯 사이드바 + 오른쪽 피드 (좁은 화면에선 패싯이 드로어로 전환)
  let h='<div class="layout'+(facetFold?' fc':'')+'">'+facetHTML()
    +(facetOpen?'<div class="scrim" id="scrim"></div>':'')
    +'<div class="feed">';
  if(!items.length){
    h+='<div class="none">'+(days?'이 기간에는 기사가 없습니다. 오른쪽 위 「전체」를 눌러보세요.'
                                  :'조건에 맞는 기사가 없습니다.')+'</div>';
  } else if(sort==='batch'){
    let last=null;
    items.forEach(d=>{
      const label=d.batchLabel||'';
      if(label && label!==last){
        const n=items.filter(x=>x.batchLabel===label).length;
        h+='<div class="group">'+label+' 수집 · '+n+'건</div>';
        last=label;
      }
      h+=rowHTML(d);
    });
  } else {
    h+=items.map(rowHTML).join('');
  }

  // 아카이브 검색 (SPEC 2.4): 30일 밖 기사는 인덱스에서 찾는다
  if(q){
    ensureIndex();
    const m=archMatches();
    if(INDEX==='fail'){ h+='<div class="archead">아카이브 검색은 로컬(file://)에서 사용할 수 없습니다.</div>'; }
    else if(INDEX==='loading'){ h+='<div class="archead">아카이브 검색 중…</div>'; }
    else if(m && m.length){ h+='<div class="archead">지난 기사 (아카이브) '+m.length+'건</div>'+m.map(archRowHTML).join(''); }
  }
  return h+'</div></div>';
}

/* 목록만 갱신 — 바(검색 input)를 건드리지 않아 한글 IME 조합이 유지되고,
   조합 중에도 실시간으로 필터링된다. 뉴스 목록 화면이 아니면 전체 렌더로 폴백. */
function renderList(){
  const box=viewEl.querySelector('.layout');
  if(!box){ render(); return; }
  box.outerHTML=layoutHTML(); bind();
}

function bind(){
  const qi=document.getElementById('q');
  // 목록만 부분 갱신(renderList)하므로 input이 교체되지 않는다 —
  // 한글 IME 조합이 유지되고 조합 중에도 즉시 필터링된다.
  if(qi) qi.oninput=e=>{ q=e.target.value; renderList(); };
  viewEl.querySelectorAll('.dd').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); openDrop = openDrop===b.id ? null : b.id; render();
  });
  viewEl.querySelectorAll('.dditem').forEach(b=>b.onclick=e=>{
    e.stopPropagation();
    if(b.dataset.dd==='sortsel') sort=b.dataset.v; else days=+b.dataset.v;
    openDrop=null; render();
  });
  const ub=document.getElementById('unread');
  if(ub) ub.onclick=()=>{unreadOnly=!unreadOnly; render();};
  viewEl.querySelectorAll('.fitem[data-f]').forEach(b=>b.onclick=()=>{filter=b.dataset.f; render();});
  viewEl.querySelectorAll('.fitem[data-ft]').forEach(b=>b.onclick=()=>toggleTag(b.dataset.ft));
  const tc=document.getElementById('tagclear');
  if(tc) tc.onclick=()=>{   // 초기화 = 패널 항목(태그·출처)만 리셋
    tagSel.clear(); persistTags(); filter='all'; render();
  };
  const tb=document.getElementById('tagbtn');
  if(tb) tb.onclick=()=>{
    // 좁은 화면 = 드로어 열기 / 데스크톱 = 패널 접기/펼치기 토글
    if(window.matchMedia('(max-width:900px)').matches){ facetOpen=true; render(); }
    else setFold(!facetFold);
  };
  const tf=document.getElementById('tagfold');
  if(tf) tf.onclick=()=>setFold(true);
  const sc=document.getElementById('scrim');
  if(sc) sc.onclick=()=>{ facetOpen=false; render(); };
  viewEl.querySelectorAll('[data-ck]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); toggleSave(DATA[+b.dataset.ck]);});
  viewEl.querySelectorAll('[data-un]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); savedMap.delete(b.dataset.un); persist(); render();});
  viewEl.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); openDetail(+b.dataset.open);});
  viewEl.querySelectorAll('[data-au]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); openArchived(b.dataset.au, b.dataset.am);});
}

function showDetail(d){
  let meta='<span class="s" style="color:'+d.color+';font-weight:700">'+d.from+'</span>';
  if(d.pub) meta+='<span class="sep">·</span><span>'+ago(d.pub)+'</span>';
  else if(d.dateLabel) meta+='<span class="sep">·</span><span>'+d.dateLabel+'</span>';
  if(d.cm) meta+='<span class="sep">·</span><span>'+d.cm+'댓글</span>';
  if(d.delta) meta+='<span class="sep">·</span><span>스타 +'+d.delta.toLocaleString()+'</span>';
  document.getElementById('db').innerHTML =
    (d.img?'<img class="hero" src="'+d.img+'" alt="" onerror="this.remove()">':'')
    + '<div class="dc"><h2>'+d.title+'</h2><div class="dmeta">'+meta+'</div>'
    + d.body
    + (d.why?'<div class="why"><b>왜 중요한가</b>'+d.why+'</div>':'')
    + '<a class="go" href="'+d.url+'" target="_blank" rel="noopener">원문 열기 ↗</a></div>';
  document.getElementById('db').scrollTop=0;
  document.getElementById('dt').classList.add('open');
}

function openDetail(i){
  cur=i; const d=DATA[i], s=SRC[d.src]||{name:d.src,color:'#999'};
  markRead(d.url);
  /* 최근 N일 밖 기사는 body·why가 인라인되지 않는다 (split-initial-payload).
     월별 샤드에서 가져온다 — 같은 달은 SHARDS에 캐시되므로 한 번만 탄다. */
  if(d.body===undefined){
    openArchived(d.url, d.month, {from:d.from, color:s.color, pub:d.pub, cm:d.cm,
      delta:(d.src==='github'?d.delta:0), img:d.img, title:d.title});
    render(); return;
  }
  showDetail({
    title:d.title, from:d.from, color:s.color, pub:d.pub, cm:d.cm,
    delta:(d.src==='github'?d.delta:0), img:d.img,
    body:(d.body && d.body!=='<p></p>')?d.body:'<p>'+(d.snip||'(요약 없음)')+'</p>',
    why:d.why||'', url:d.url
  });
  render();
}
function closeDetail(){
  cur=null;
  document.getElementById('dt').classList.remove('open');
  render();
}
function copyMd(){
  const md=[...savedMap.values()]
    .map(sv=>{
      const d=DATA.find(x=>x.url===sv.url);
      return '- ['+sv.title+']('+sv.url+')'+(d&&d.snip?'\n  '+d.snip:'');
    }).join('\n');
  navigator.clipboard.writeText('## __DATE__ 개발·AI 뉴스\n\n'+md)
    .then(()=>alert('클립보드에 복사했습니다.'))
    .catch(()=>alert('복사에 실패했습니다. 직접 선택해 복사해 주세요.'));
}
document.querySelectorAll('.rb').forEach(b=>b.onclick=()=>{view=b.dataset.v; q=''; render();});
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeDetail(); });
render();
</script>
</body>
</html>
